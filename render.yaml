services:
  - type: web
    name: twelve-labs
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ALLOWED_ORIGIN
        value: "https://twelve-labs.onrender.com"
    healthCheckPath: /