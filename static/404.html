<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Twelve Labs</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Twelve Labs to convert text to speech for free.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0e0d12" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("twelvelabs-theme");
                var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <div class="notfound-shell">
        <div class="notfound-code">404</div>
        <h1 class="notfound-title">Page not found</h1>
        <p class="notfound-text">
            The page you're looking for doesn't exist or may have moved.
            Head back to Twelve Labs to convert your text to speech.
        </p>
        <a class="notfound-home" href="/">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Back to home
        </a>
    </div>
</body>
</html>
