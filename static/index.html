<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta -->
    <title>Twelve Labs — Free Text to Speech Converter | Neural AI Voice Generator</title>
    <meta name="description" content="Convert text to natural, human-like speech online for free. Twelve Labs uses neural voice synthesis to generate realistic MP3 audio with adjustable speed, pitch, and volume — no sign-up or API key required.">
    <meta name="keywords" content="text to speech, TTS, voice generator, AI voice, neural speech, audio generation, text to mp3, free tts, twelve labs">
    <meta name="author" content="Twelve Labs">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://twelvelabs.onrender.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="Twelve Labs — Free Text to Speech Converter">
    <meta property="og:description" content="Neural voice synthesis that turns text into natural speech. Free, fast, no account needed.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://twelvelabs.onrender.com/">
    <meta property="og:site_name" content="Twelve Labs">
    <meta property="og:locale" content="en_US">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Twelve Labs — Free Text to Speech Converter">
    <meta name="twitter:description" content="Neural voice synthesis that turns text into natural speech. Free, fast, no account needed.">

    <!-- Theme -->
    <meta name="theme-color" content="#0e0d12" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">

    <!-- Structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Twelve Labs",
        "url": "https://twelvelabs.onrender.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "description": "Free online text-to-speech converter using neural voice synthesis.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("twelvelabs-theme");
                var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <a class="wordmark" href="/"><h3>Twelve<span>Labs</span></h3></a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme" title="Toggle theme">
                <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </header>

        <section class="hero">
            <p class="hero-sub">Free neural text-to-speech. No sign-up, no API key.</p>
        </section>

        <main class="studio">
            <div class="studio-card" id="studioCard">
                <textarea
                    id="textInput"
                    class="studio-input"
                    placeholder="Type or paste the text you want to hear…"
                    maxlength="5000"
                    spellcheck="true"
                ></textarea>

                <div class="studio-metabar">
                    <span class="char-counter" id="charCounter">0 / 5,000</span>
                </div>

                <div class="studio-toolbar">
                    <div class="field field-voice">
                        <label for="voiceSelect">Voice</label>
                        <div class="select-wrapper">
                            <select id="voiceSelect">
                                <option value="" disabled selected>Loading voices…</option>
                            </select>
                            <svg class="select-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                        </div>
                    </div>

                    <div class="field field-slider">
                        <label for="speedSlider">Speed <span id="speedValue">1.0x</span></label>
                        <input type="range" id="speedSlider" class="dial" min="-50" max="100" value="0" step="10">
                    </div>

                    <div class="field field-slider">
                        <label for="pitchSlider">Pitch <span id="pitchValue">0 Hz</span></label>
                        <input type="range" id="pitchSlider" class="dial" min="-50" max="50" value="0" step="5">
                    </div>

                    <div class="field field-slider">
                        <label for="volumeSlider">Volume <span id="volumeValue">100%</span></label>
                        <input type="range" id="volumeSlider" class="dial" min="-50" max="0" value="0" step="5">
                    </div>

                    <button class="generate-btn" id="generateBtn">
                        <span class="btn-content">Generate</span>
                        <span class="btn-loading" style="display:none;">
                            <span class="spinner"></span>
                            Generating
                        </span>
                    </button>
                </div>

                <p class="voice-hint" id="voiceInfo"></p>

                <div class="output-area">
                    <div class="empty-state" id="emptyState">
                        <p>Your audio will appear here once generated.</p>
                    </div>

                    <div class="player" id="playerSection" style="display:none;">
                        <div class="waveform-wrap">
                            <canvas id="waveformCanvas"></canvas>
                        </div>

                        <div class="transport">
                            <button class="play-btn" id="playBtn" title="Play or pause" aria-label="Play or pause">
                                <svg class="icon-play" id="iconPlay" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <svg class="icon-pause" id="iconPause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            </button>
                            <span class="time-display" id="currentTime">0:00</span>
                            <div class="progress-bar-wrap" id="progressBarWrap">
                                <div class="progress-bar" id="progressBar"></div>
                                <div class="progress-knob" id="progressKnob"></div>
                            </div>
                            <span class="time-display" id="totalTime">0:00</span>
                        </div>

                        <div class="player-footer">
                            <div class="meta-row">
                                <span id="infoVoice">—</span>
                                <span id="infoDuration">—</span>
                                <span id="infoSize">—</span>
                            </div>
                            <div class="download-row">
                                <button class="download-btn" id="downloadMp3">Download MP3</button>
                                <button class="download-btn download-btn-ghost" id="downloadWav">WAV</button>
                            </div>
                        </div>
                    </div>

                    <div class="error-state" id="errorState" style="display:none;">
                        <p id="errorMessage">Something went wrong. Please try again.</p>
                        <button class="retry-btn" id="retryBtn">Try again</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="foot">
            <p>Twelve Labs — neural voice synthesis.</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
